<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Medal Optimizer</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <div class="branding">
          <h1>Medal Optimizer</h1>
          <h2>Helldivers 2 Warbond Planner</h2>
        </div>
        <div class="warbond-picker">
          <select id="warbond" aria-label="Warbond"></select>
        </div>
      </header>

      <p id="status" role="status">Loading warbond data…</p>
      <div id="pages"></div>
    </main>

    <div class="actions" role="toolbar" aria-label="Preference actions">
      <button id="how-to-use" type="button">How to use</button>
      <div class="preference-actions">
        <button id="reset" type="button">Reset</button>
        <button id="clear" type="button">Clear</button>
      </div>
      <output id="medal-total" aria-label="Total medals selected">💀 0</output>
    </div>
  </body>
</html>
